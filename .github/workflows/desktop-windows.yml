name: Desktop (Windows)

# Windows用デスクトップ(.exe)を windows ランナーでビルドし成果物化する。
# 手動実行(workflow_dispatch) / desktop-v* タグ / 開発ブランチへの push でトリガー。
on:
  workflow_dispatch:
  push:
    tags:
      - "desktop-v*"
    branches:
      - "claude/**"

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write   # desktop-v* タグ時に Release を作成・アセット添付するため
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Windows installer
        working-directory: packages/desktop
        env:
          # 署名証明書なしのビルド（未署名インストーラ）
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          bun run build
          bunx electron-builder --win nsis --publish never

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: seisan-windows-installer
          path: |
            packages/desktop/release/**/*.exe
          if-no-files-found: error

      # desktop-v* タグ push、または手動実行(workflow_dispatch)のときに
      # GitHub Release へ .exe を直接添付する。tag_name を明示するため、
      # タグを手で push しなくても Release とタグを自動生成できる。
      # 公開リポジトリなので、リリースページから誰でもログイン不要でダウンロード可能。
      - name: Publish GitHub Release
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/desktop-v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-v0.1.0
          name: 経費精算デスクトップアプリ v0.1.0
          files: packages/desktop/release/**/*.exe
          draft: false
          prerelease: false
          body: |
            ## 経費精算デスクトップアプリ（Windows・スタンドアロン）

            **下の Assets にある `Seisan-Windows-*-Setup.exe` をダウンロードして実行するだけで使えます。**
            サーバー準備や設定は不要で、データはお使いの PC 内に保存されます（オフライン動作）。

            ### 使い方
            1. `Seisan-Windows-*-Setup.exe` をダウンロード
            2. ダブルクリックしてインストール（画面の指示に従う）
            3. 起動して最初のアカウントを作成 → そのまま利用開始（最初の登録者が管理者になります）

            ### ⚠️ ご注意（未署名アプリ）
            コード署名をしていないため、初回起動時に **「WindowsによってPCが保護されました」** という青い警告が出ることがあります。
            その場合は **「詳細情報」→「実行」** を押すと起動できます（このアプリが原因の警告で、動作に問題はありません）。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
