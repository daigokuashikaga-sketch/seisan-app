name: Desktop (Windows)

# Windows用デスクトップ(.exe)を windows ランナーでビルドし成果物化する。
# 手動実行(workflow_dispatch) または desktop-v* タグの push でトリガー。
on:
  workflow_dispatch:
  push:
    tags:
      - "desktop-v*"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Windows installer
        working-directory: packages/desktop
        env:
          # 署名証明書なしのビルド（未署名インストーラ）
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          bun run build
          bunx electron-builder --win nsis --publish never

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: seisan-windows-installer
          path: |
            packages/desktop/release/**/*.exe
          if-no-files-found: error
