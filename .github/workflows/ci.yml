name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/web
    env:
      # ビルド/型チェックを env 欠落で落とさないためのダミー値
      DATABASE_URL: ":memory:"
      DATABASE_AUTH_TOKEN: ""
      BETTER_AUTH_SECRET: "ci-test-secret-ci-test-secret"
      WEBSITE_URL: "http://localhost:3000"
      NODE_ENV: "test"
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Install dependencies
        working-directory: .
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build
